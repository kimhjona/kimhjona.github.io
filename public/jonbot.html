  <body>
    <header>
      <h1 class="text-center text-2xl font-bold my-4">Chat with JonBot</h1>
    </header>
    <main>
      <div class="container mx-auto px-4">
        <div id="chat-container" class="w-full max-w-2xl mx-auto">
          <div class="bg-white shadow-md rounded-lg w-full">
            <div
              id="chatbox"
              class="p-4 sm:h-96 h-60 border-t rounded-lg overflow-y-auto"
            >
              <!-- Chat messages will be displayed here -->
              <div class="mb-2 text-right">
                <p
                  class="bg-blue-500 text-white rounded-lg py-2 px-4 inline-block"
                >
                  Hello...What is this?
                </p>
              </div>
              <div class="mb-2">
                <p
                  class="bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block"
                >
                  Hi! Welcome to JonBot. What do you want to know about Jon Kim?
                </p>
              </div>
            </div>
            <div class="p-4 border-t flex">
              <input
                id="user-input"
                type="text"
                placeholder="Type a message"
                class="w-full px-3 py-2 border rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <button
                id="send-button"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-md hover:bg-blue-600 transition duration-300"
              >
                Send
              </button>
            </div>
            <div
              class="p-4 border-t flex flex-wrap justify-start gap-y-2 gap-x-2"
            >
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                Who is Jon?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                Will Jon be my friend?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                What is Jon up to now?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                What languages does Jon speak?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                안녕하세요?
              </p>
            </div>
          </div>
        </div>
        <div class="text-center mt-6">
          <a href="index.html" class="text-blue-500 hover:underline"
            >← Back to Homepage</a
          >
        </div>
      </div>
    </main>

    <script>
      const myInfo = JSON.parse(document.getElementById("myInfo").textContent);

      const chatbox = document.getElementById("chatbox");
      const userInput = document.getElementById("user-input");
      const sendButton = document.getElementById("send-button");

      // Add an event listener to the send button
      sendButton.addEventListener("click", function () {
        const userMessage = userInput.value;
        if (userMessage.trim() !== "") {
          addUserMessage(userMessage);
          respondToUser(userMessage);
          userInput.value = "";
        }
      });

      userInput.addEventListener("keyup", function (event) {
        if (event.key === "Enter") {
          const userMessage = userInput.value;
          addUserMessage(userMessage);
          respondToUser(userMessage);
          userInput.value = "";
        }
      });

      function addUserMessage(message) {
        const messageElement = document.createElement("div");
        messageElement.classList.add("mb-2", "text-right");
        messageElement.innerHTML = `<p class="bg-blue-500 text-white rounded-lg py-2 px-4 inline-block">${message}</p>`;
        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight;
      }

      function addBotMessage(message) {
        const messageElement = document.createElement("div");
        messageElement.classList.add("mb-2");
        messageElement.innerHTML = `<p class="bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block">${message}</p>`;
        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight;
      }

      function respondToUser(userMessage) {
        fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            messages: [
              {
                role: "system",
                content: `You are JonBot, and you exist to answer questions about Jon Kim. Your responses should reference the following JSON data: ${JSON.stringify(
                  myInfo
                )}. Do not generate answers based on any other knowledge. If asked anything not in this data, respond with 'I don't have information on that topic.'`,
              },
              { role: "user", content: userMessage },
            ],
            model: "jamba-mini",
          }),
        })
          .then(function (response) {
            return response.json();
          })
          .then(function (data) {
            const message = data.choices[0].message.content;
            addBotMessage(message);
          });
      }

      document.querySelectorAll(".suggestion-box").forEach((box) => {
        box.addEventListener("click", function () {
          userInput.value = this.textContent.trim();
        });
      });
    </script>
  </body>
</html>
