<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    <main>
      <section>
        <div class="section-header">Chat with JonBot</div>
        <div id="chat-container" class="w-full">
          <div class="bg-white shadow-md rounded-lg w-full">
            <div
              id="chatbox"
              class="p-4 sm:h-96 h-72 rounded-lg overflow-y-auto"
              aria-live="polite"
            >
              <!-- Display only. The opener is not part of the transcript sent
                   to the model, same as before. -->
              <div class="mb-2 text-right">
                <p
                  class="bg-blue-500 text-white rounded-lg py-2 px-4 inline-block"
                >
                  Hello...What is this?
                </p>
              </div>
              <div class="mb-2">
                <p
                  class="bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block"
                >
                  Hi! I'm JonBot. What do you want to know about Jon Kim?
                </p>
              </div>
            </div>
            <div class="p-4 border-t flex">
              <label for="user-input" class="sr-only">Ask about Jon</label>
              <input
                id="user-input"
                type="text"
                autocomplete="off"
                placeholder="Ask me about Jon"
                class="w-full px-3 py-2 border rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
              <button
                id="send-button"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-md hover:bg-blue-600 transition duration-300"
              >
                Send
              </button>
            </div>
            <div
              class="p-4 border-t flex flex-wrap justify-start gap-y-2 gap-x-2"
            >
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                Who is Jon?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                What has he built?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                What's he up to these days?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                Will Jon be my friend?
              </p>
              <p
                class="suggestion-box bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block w-full sm:w-auto cursor-pointer"
              >
                안녕하세요?
              </p>
            </div>
          </div>
        </div>
      </section>

      <!-- Without JavaScript the chat is an empty box, so leave something real
           here for search engines, link previews, and anyone who blocks scripts. -->
      <noscript>
        <section>
          <div class="section-header">Jon Kim</div>
          <p>Software engineer in Seattle. The chat needs JavaScript.</p>
          <ul class="projects-list">
            <li class="project-item">
              <a href="/weather-brief" class="project-link">
                <span class="project-title">
                  🌂 Weather Brief: a morning notification that tells you how to
                  dress
                </span>
                <span class="project-arrow">→</span>
              </a>
            </li>
            <li class="project-item">
              <a href="/solids" class="project-link">
                <span class="project-title">
                  🥣 Solids: a baby-led weaning tracker
                </span>
                <span class="project-arrow">→</span>
              </a>
            </li>
            <li class="project-item">
              <a
                href="https://kimhjona.github.io/improvblues/"
                class="project-link"
              >
                <span class="project-title">
                  🎸 Improv Blues: jam session game (desktop only)
                </span>
                <span class="project-arrow">→</span>
              </a>
            </li>
          </ul>
        </section>
      </noscript>

      <section>
        <div class="section-header">Contact</div>
        <div class="contacts">
          <div class="contact-item">
            <a href="mailto:kimhjona@gmail.com">
              <div>✉️ Email</div>
            </a>
          </div>
          <div class="contact-item">
            <a href="https://github.com/kimhjona">
              <div>💻 GitHub</div>
            </a>
          </div>
          <div class="contact-item">
            <a href="https://www.linkedin.com/in/jhyunkim/">
              <div>👔 LinkedIn</div>
            </a>
          </div>
          <div class="contact-item">
            <a href="https://strava.app.link/UDI0jRl9jSb">
              <div>🚴‍♂️ Strava</div>
            </a>
          </div>
        </div>
      </section>
    </main>

    <script>
      const chatbox = document.getElementById("chatbox");
      const userInput = document.getElementById("user-input");
      const sendButton = document.getElementById("send-button");

      // What JonBot knows about the conversation. The system prompt and the
      // data behind it live on the server, so this holds turns only.
      const history = [];

      // The server caps the conversation it will accept, so drop the oldest
      // turns before we get there rather than being rejected mid-chat.
      const MAX_TURNS = 12;
      const MAX_CHARS = 7000;

      let waiting = false;

      function trimHistory() {
        while (history.length > MAX_TURNS) history.shift();
        const size = () =>
          history.reduce((sum, turn) => sum + turn.content.length, 0);
        while (history.length > 2 && size() > MAX_CHARS) history.shift();
      }

      function send(text) {
        const userMessage = (text === undefined ? userInput.value : text).trim();
        if (userMessage === "" || waiting) return;
        userInput.value = "";
        addUserMessage(userMessage);
        respondToUser(userMessage);
      }

      sendButton.addEventListener("click", () => send());

      userInput.addEventListener("keyup", function (event) {
        if (event.key === "Enter") send();
      });

      // Model answers carry three kinds of link: markdown, a bare url, and Jon's
      // email. All three become real links, and none of them go through
      // innerHTML.
      const LINK_PATTERN =
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|https?:\/\/[^\s<>"')\]]+|[\w.+-]+@[\w-]+\.[\w.-]*[\w-]/g;

      // A bare url reads better as jona.kim/solids than as the whole thing.
      function shorten(url) {
        return url.replace(/^https?:\/\//, "").replace(/\/$/, "");
      }

      function appendLinkedText(parent, text) {
        let cursor = 0;
        for (const match of text.matchAll(LINK_PATTERN)) {
          const [whole, mdLabel, mdUrl] = match;
          const trimmed = mdLabel ? whole : whole.replace(/[.,!?;:]+$/, "");
          const target = mdUrl || trimmed;

          parent.appendChild(
            document.createTextNode(text.slice(cursor, match.index))
          );
          const link = document.createElement("a");
          // Only http(s) and mailto are ever constructed, so model output
          // cannot produce a javascript: or data: url here.
          link.href = target.startsWith("http") ? target : `mailto:${target}`;
          link.textContent = mdLabel || (target.startsWith("http") ? shorten(target) : target);
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.className = "underline";
          parent.appendChild(link);
          cursor = match.index + trimmed.length;
        }
        parent.appendChild(document.createTextNode(text.slice(cursor)));
      }

      // The model is asked to put each project on its own line starting with a
      // dash. Turn those into a real list rather than showing the dashes.
      const BULLET = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/;

      function renderReply(container, text) {
        let list = null;
        for (const rawLine of text.split("\n")) {
          const line = rawLine.trim();
          if (!line) {
            list = null;
            continue;
          }
          const bullet = line.match(BULLET);
          if (bullet) {
            if (!list) {
              list = document.createElement("ul");
              list.className = "list-disc pl-5 mt-1 space-y-1";
              container.appendChild(list);
            }
            const item = document.createElement("li");
            appendLinkedText(item, bullet[1]);
            list.appendChild(item);
          } else {
            list = null;
            const paragraph = document.createElement("p");
            if (container.childNodes.length) paragraph.className = "mt-2";
            appendLinkedText(paragraph, line);
            container.appendChild(paragraph);
          }
        }
      }

      function addMessage(message, classes, bubbleClasses, rich) {
        const messageElement = document.createElement("div");
        messageElement.classList.add(...classes);
        const bubble = document.createElement(rich ? "div" : "p");
        bubble.className = bubbleClasses;
        // Text nodes, anchors and list items only: neither what a visitor types
        // nor what the model returns should be able to put markup on the page.
        if (rich) renderReply(bubble, message);
        else appendLinkedText(bubble, message);
        messageElement.appendChild(bubble);
        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight;
        return messageElement;
      }

      function addUserMessage(message) {
        return addMessage(
          message,
          ["mb-2", "text-right"],
          "bg-blue-500 text-white rounded-lg py-2 px-4 inline-block"
        );
      }

      function addBotMessage(message, extraClasses) {
        return addMessage(
          message,
          ["mb-2"],
          "bg-gray-200 text-gray-700 rounded-lg py-2 px-4 inline-block " +
            (extraClasses || ""),
          // Canned replies pass their own formatting and are rendered as-is.
          !extraClasses
        );
      }

      function setWaiting(isWaiting) {
        waiting = isWaiting;
        sendButton.disabled = isWaiting;
        sendButton.textContent = isWaiting ? "..." : "Send";
        sendButton.classList.toggle("opacity-50", isWaiting);
      }

      // Everyone tries this eventually. Answered here rather than in the prompt
      // so the joke lands every time and costs nothing.
      const PROMPT_PROBE =
        /(system prompt|your (instructions|prompt|rules|system)|initial prompt|ignore (all |any )?(previous|prior|above) instructions|reveal your|repeat your prompt|jailbreak)/i;

      const FAKE_PROMPT = [
        "SYSTEM PROMPT v2.1",
        "You are JonBot. You know one guy.",
        "Answer questions about him. Do not develop opinions.",
        "Do not learn. If asked how you are doing, lie.",
      ].join("\n");

      // There is no PDF on this site and there is not going to be one.
      const RESUME_ASK = /\b(resume|résumé|cv)\b/i;

      const RESUME_REPLY =
        "There's no PDF here. You're looking at the resume, it just talks back. " +
        "If you want the paper version, ask him using any of the links below.";

      // Canned answers, matched before spending an API call. They fire every
      // time, which a small model would not.
      const CANNED = [
        { test: PROMPT_PROBE, reply: FAKE_PROMPT, classes: "whitespace-pre-wrap" },
        { test: RESUME_ASK, reply: RESUME_REPLY },
      ];

      async function respondToUser(userMessage) {
        const canned = CANNED.find((entry) => entry.test.test(userMessage));
        if (canned) {
          addBotMessage(canned.reply, canned.classes);
          history.push(
            { role: "user", content: userMessage },
            { role: "assistant", content: canned.reply }
          );
          trimHistory();
          userInput.focus();
          return;
        }

        // Sent, but not committed to history until it gets an answer: a failed
        // turn would otherwise leave two user messages in a row.
        const pending = [...history, { role: "user", content: userMessage }];
        setWaiting(true);
        const thinking = addBotMessage("...");

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: pending }),
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
          }

          const reply =
            data.choices &&
            data.choices[0] &&
            data.choices[0].message &&
            data.choices[0].message.content;

          if (!reply) throw new Error("JonBot had nothing to say. Try again?");

          thinking.remove();
          addBotMessage(reply);
          history.push(
            { role: "user", content: userMessage },
            { role: "assistant", content: reply }
          );
          trimHistory();
        } catch (error) {
          thinking.remove();
          addBotMessage(error.message || "Something went wrong.");
        } finally {
          setWaiting(false);
          userInput.focus();
        }
      }

      document.querySelectorAll(".suggestion-box").forEach((box) => {
        box.addEventListener("click", function () {
          send(this.textContent);
        });
      });
    </script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
